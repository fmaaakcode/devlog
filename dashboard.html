<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLog</title>
    <link rel="stylesheet" href="/assets/dashboard.css">
</head>
<body>
    <div id="memPopover"></div>
    <div id="filePopup" class="file-popup"></div>

    <div class="topbar" id="topbar">
        <div class="topbar-left" id="topbarLeft"></div>
        <div class="live-banner" id="liveBanner" style="opacity:0"></div>
        <div class="topbar-right">
            <div class="top-actions">
                <button type="button" class="rescan-btn" data-action="toggle-lang" data-i18n="lang.toggle" data-i18n-title="lang.toggleTitle">🌐</button>
                <button type="button" class="rescan-btn" data-action="rescan-project" data-i18n="scan.rescan">Rescan</button>
                <button type="button" class="vuln-btn" data-action="vuln-scan" data-i18n="vuln.scanBtn">Security scan</button>
                <button type="button" class="inj-btn" data-action="open-injection-panel" data-i18n="inj.modalTitle">Injection</button>
                <button type="button" class="inj-btn" data-action="open-standards-panel" data-i18n="topbar.standards">Standards</button>
                <button type="button" class="kill-srv-btn" data-action="kill-server" data-i18n="srv.stop" data-i18n-title="srv.stopTitle">Stop server</button>
            </div>
            <span id="updates-badge" style="display:none;font-size:0.7em;padding:3px 10px;border-radius:5px;background:#1a2a0d;color:#9bd45f;border:1px solid #2a4a15;cursor:pointer;font-weight:600" data-action="open-updates-popup" data-i18n-title="upd.badgeTitle"></span>
            <div class="topbar-logo">DevLog</div>
        </div>
    </div>

    <div class="page-body">
    <div class="sidebar">
        <div class="project-list project-list-active" id="projectListActive"></div>
        <div class="project-list project-list-other" id="projectListOther"></div>
        <div id="maintRow"></div>
    </div>

    <div class="main" id="mainArea">
        <div class="welcome" id="welcome">
            <div>
                <h2>DevLog</h2>
                <p data-i18n-html="welcome.text">
                    An automatic dev log for all your projects<br>
                    Tracks changes, libraries and security issues<br>
                    Pick a project from the list or just start working
                </p>
            </div>
        </div>

        <div id="projectView" style="display:none; flex-direction:column; overflow:hidden; height:100%">
            <div class="project-row">
                <div class="project-header" id="projectHeader"></div>
                <div id="vuln-panel" class="vuln-panel"></div>
                <div class="stats-pair">
                    <div id="statsNumbers" class="stats-numbers" style="display:none"></div>
                    <div id="centerStats" class="center-stats" style="display:none"></div>
                </div>
            </div>
            <div id="panel-files" style="flex:1;overflow:hidden;padding:16px 8px 16px 24px;min-height:0"></div>
        </div>
    </div>
    </div>

    <div class="ctx-menu" id="ctxMenu">
        <div class="ctx-menu-item" id="ctxOpenLabel" data-action="open-target-file" data-i18n="ctx.openFile">Open in a new window</div>
        <div class="ctx-menu-item" id="ctxIgnoreLabel" data-action="ignore-target"></div>
    </div>

    <div class="inj-modal-bg" id="injModal" data-action="close-injection-panel">
        <div class="inj-modal" data-action="noop">
            <div class="inj-header">
                <span class="inj-title"><span data-i18n="inj.modalTitle">Injection</span> — <span id="injProjectName"></span></span>
                <button type="button" class="inj-close" data-action="close-injection-panel">&times;</button>
            </div>
            <div class="inj-body" id="injBody"></div>
        </div>
    </div>

    <div class="inj-modal-bg" id="stdModal" data-action="close-standards-panel">
        <div class="inj-modal" data-action="noop">
            <div class="inj-header">
                <span class="inj-title"><span data-i18n="topbar.standards">Standards</span> — <span id="stdProjectName"></span></span>
                <button type="button" class="inj-close" data-action="close-standards-panel">&times;</button>
            </div>
            <div class="inj-body" id="stdBody"></div>
        </div>
    </div>

    <script type="module" src="/assets/dashboard-main.js"></script>
</body>
</html>
